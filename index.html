<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Data Institute - HK Mark Six Predictions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b0e14;
      color: #e1e6ed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }
    
    /* 頂部科技黑金 Banner */
    .header-banner {
      width: 100%;
      max-width: 650px;
      background: linear-gradient(135deg, #07090e 0%, #121824 50%, #07090e 100%);
      border: 1px solid #c5a059;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 15px rgba(197, 160, 89, 0.2);
      margin-bottom: 20px;
    }
    .header-banner h1 {
      color: #dfb76c;
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .header-banner .subtitle {
      color: #00a2ff;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    /* 主數據卡片 */
    .card {
      width: 100%;
      max-width: 650px;
      background: #121824;
      border: 1px solid rgba(197, 160, 89, 0.4);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(197, 160, 89, 0.3);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 16px;
      color: #ffffff;
      font-weight: bold;
    }
    .draw-meta {
      font-size: 13px;
      color: #00a2ff;
      font-family: monospace;
    }

    /* 六合彩號碼球（發光效果） */
    .balls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .ball {
      width: 42px;
      height: 42px;
      line-height: 40px;
      border-radius: 50%;
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.6);
      display: inline-block;
    }
    .red {
      background: #d32f2f;
      box-shadow: 0 0 8px rgba(211, 47, 47, 0.8);
    }
    .blue {
      background: #1976d2;
      box-shadow: 0 0 8px rgba(25, 118, 210, 0.8);
    }
    .green {
      background: #388e3c;
      box-shadow: 0 0 8px rgba(56, 142, 60, 0.8);
    }
    .plus {
      font-size: 20px;
      color: #dfb76c;
      font-weight: bold;
      padding: 0 4px;
    }

    /* 派彩表格 */
    .section-header {
      color: #dfb76c;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      padding-left: 8px;
      border-left: 3px solid #00a2ff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
    }
    th {
      background: rgba(0, 0, 0, 0.5);
      color: #8899a6;
    }
    td {
      color: #d0d7de;
    }
    .prize-name {
      color: #ffffff;
      font-weight: bold;
    }
    .amount {
      color: #00e676;
      font-weight: bold;
      font-family: monospace;
    }

    /* Telegram 按鈕 */
    .action-btns {
      text-align: center;
      margin-top: 20px;
    }
    .btn-tg {
      display: inline-block;
      background: #0088cc;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(0, 136, 204, 0.5);
    }
  </style>
</head>
<body>

  <div class="header-banner">
    <h1>BIG DATA INSTITUTE</h1>
    <div class="subtitle">MARK SIX MATRIX PREDICTIONS</div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">最新攪珠數據分析</div>
      <div class="draw-meta" id="draw-meta">載入數據中...</div>
    </div>

    <div class="balls-row" id="balls-container"></div>

    <div class="section-header">大數據派彩紀錄</div>
    <table>
      <thead>
        <tr>
          <th>獎項</th>
          <th>中獎注數</th>
          <th>每注派彩</th>
        </tr>
      </thead>
      <tbody id="prizes-body">
        <tr><td colspan="3" style="color:#8899a6;">數據載入中...</td></tr>
      </tbody>
    </table>

    <div class="action-btns">
      <a href="https://telegram.me/MARKSIXHK01" target="_blank" class="btn-tg">加入 Telegram 官方頻道</a>
    </div>
  </div>

  <script>
    fetch('data.json?t=' + new Date().getTime())
      .then(function(res) { return res.json(); })
      .then(function(data) {
        document.getElementById('draw-meta').innerText = '期數: ' + data.period + ' | ' + data.date;
        
        var container = document.getElementById('balls-container');
        container.innerHTML = '';
        if (data.numbers) {
          data.numbers.forEach(function(item, index) {
            if (index === 6) {
              var plus = document.createElement('span');
              plus.className = 'plus';
              plus.innerText = '+';
              container.appendChild(plus);
            }
            var ball = document.createElement('span');
            ball.className = 'ball ' + item.color;
            ball.innerText = item.code;
            container.appendChild(ball);
          });
        }

        var prizesBody = document.getElementById('prizes-body');
        prizesBody.innerHTML = '';
        if (data.prizes) {
          data.prizes.forEach(function(p) {
            var row = document.createElement('tr');
            row.innerHTML = '<td class="prize-name">' + p.prize + '</td><td>' + p.winning_units + '</td><td class="amount">' + p.per_unit + '</td>';
            prizesBody.appendChild(row);
          });
        }
      })
      .catch(function(err) {
        document.getElementById('draw-meta').innerText = '數據載入失敗';
      });
  </script>

</body>
</html>
